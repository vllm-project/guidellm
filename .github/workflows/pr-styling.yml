name: PR Styling

on:
  # This has to be pull_request_target since its editing but
  # that means the the version from main runs not the PR's
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-description:
    # Skip formatting Mergify queues
    if: >-
      ${{ !(github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch the PR branch since we are on base repo
          # NOTE: DO NOT checkout the branch
          git fetch origin "refs/pull/${PR_NUMBER}/head"

          CURRENT_BODY="$(gh pr view "$PR_NUMBER" --json body -q .body)"

          NEW_BODY_FILE="$(mktemp)"
          printf '%s' "$CURRENT_BODY" \
            | python3 scripts/format_pr.py "origin/$PR_BASE_REF" "$PR_HEAD_SHA" \
            > "$NEW_BODY_FILE"
          NEW_BODY="$(cat "$NEW_BODY_FILE")"

          if [ "$CURRENT_BODY" = "$NEW_BODY" ]; then
            echo "PR body is already up to date, skipping update."
            rm -f "$NEW_BODY_FILE"
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --body-file "$NEW_BODY_FILE"
          rm -f "$NEW_BODY_FILE"

  certification-check:
    # Skip Mergify queues, as above
    if: >-
      ${{ !(github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-slim
    # The body is read from the event payload; no token scopes are needed
    permissions: {}
    steps:
      # Bot-authored PRs (e.g. Dependabot) never use the template. Skip the
      # step, not the job, so the job still reports success for check-success.
      - name: Verify certification and AI disclosure
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # PR_BODY is untrusted: keep it in a variable and never echo it.
          BODY="${PR_BODY:-}"

          # Ignore generated content below the same marker format_pr.py uses.
          BODY="${BODY%%<!-- begin:squash-data -->*}"

          if ! grep -q -i -F -- '- By submitting this PR I certify that I have reviewed every change and addition to this pull request and take responsibility for its correctness, quality, and impact.' <<< "$BODY"; then
            echo "::error title=Certification required::Keep the certification statement from the PR template in the description."
            exit 1
          fi

          if ! grep -q -i -E '^[[:space:]]*[-*+][[:space:]]+\[x\][[:space:]]+(No AI was used in the creation of this PR|Includes code generated or substantially modified by an AI agent|Includes tests generated or substantially modified by an AI agent|AI was used to create this description or communicate with maintainers)' <<< "$BODY"; then
            echo "::error title=AI disclosure required::Check at least one box in the 'Use of AI' section of the PR description."
            exit 1
          fi

          echo "Certification statement is present and at least one use-of-AI box is checked."
