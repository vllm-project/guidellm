name: PR Styling

on:
  # This has to be pull_request_target since its editing but
  # that means the the version from main runs not the PR's
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-description:
    # Skip formatting Mergify queues
    if: >-
      ${{ !(github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch the PR branch since we are on base repo
          # NOTE: DO NOT checkout the branch
          git fetch origin "refs/pull/${PR_NUMBER}/head"

          CURRENT_BODY="$(gh pr view "$PR_NUMBER" --json body -q .body)"

          NEW_BODY_FILE="$(mktemp)"
          printf '%s' "$CURRENT_BODY" \
            | python3 scripts/format_pr.py "origin/$PR_BASE_REF" "$PR_HEAD_SHA" \
            > "$NEW_BODY_FILE"
          NEW_BODY="$(cat "$NEW_BODY_FILE")"

          if [ "$CURRENT_BODY" = "$NEW_BODY" ]; then
            echo "PR body is already up to date, skipping update."
            rm -f "$NEW_BODY_FILE"
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --body-file "$NEW_BODY_FILE"
          rm -f "$NEW_BODY_FILE"

  certification-check:
    # Skip Mergify queues, as above
    if: >-
      ${{ !(github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
            startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-slim
    # The body is read from the event payload; no token scopes are needed
    permissions: {}
    steps:
      # Bot-authored PRs (e.g. Dependabot) never use the template. Skip the
      # step, not the job, so the job still reports success for check-success.
      - name: Verify certification checkbox
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Ignore generated content below the same marker format_pr.py uses
          BODY="${PR_BODY:-}"
          BODY="${BODY%%<!-- begin:squash-data -->*}"
          if grep -qiE '^[[:space:]]*[-*+][[:space:]]+\[x\][[:space:]]*"?I certify that all code in this PR is my own, except as noted below\.' <<< "$BODY"; then
            echo "Certification checkbox is checked."
            exit 0
          fi
          echo "::error title=Certification required::Check the certification checkbox in the PR description:"
          echo '- [x] "I certify that all code in this PR is my own, except as noted below."'
          exit 1
