name: 'Run tox with environment'
description: 'Runs tox with uv as the package manager'
inputs:
  python-version:
    type: string
    required: true
  tox-env:
    type: string
    required: true
  tox-args:
    type: string
    required: false
runs:
  using: "composite"
  steps:
    - name: Setup Python with UV
      uses: ./.github/actions/python-uv
      with:
        python-version: ${{ inputs.python-version }}
        sync-args: "--only-group env"
    - name: Cache HuggingFace
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/huggingface
        key: huggingface-${{ runner.os }}-${{ inputs.python-version }}-${{ github.job }}
        restore-keys: |
          huggingface-${{ runner.os }}-${{ inputs.python-version }}-
          huggingface-${{ runner.os }}-
    - name: Run tox
      run: |
        uv run tox run -e "${{ inputs.tox-env }}" -- ${{ inputs.tox-args }} || ret=$?
        # errno 5 means all tests were filtered out, ignore
        [[ "${ret:=0}" -eq 5 ]] && exit 0; exit $ret
      shell: bash
